rootProject.name = 'jmix-docs'

/**
 * Returns the branch to check out in an external sample repository, or null to use
 * the default branch of that repository. Resolution order:
 *   1. -PsamplesBranch.<repo-name>=<branch> - override for a single repository
 *   2. the branch passed to cloneOrPull()   - branch pinned for a repository
 *   3. -PsamplesBranch=<branch> or samplesBranch in gradle.properties
 */
String resolveSamplesBranch(String repoName, String pinnedBranch) {
    def perRepoBranch = settings.providers.gradleProperty("samplesBranch.${repoName}").getOrNull()
    return perRepoBranch ?: pinnedBranch ?: settings.providers.gradleProperty('samplesBranch').getOrNull()
}

void cloneOrPull(String repoUrl, String targetDir, String pinnedBranch = null) {
    File dir = file(targetDir)
    def branch = resolveSamplesBranch(dir.name, pinnedBranch)
    if (!dir.exists()) {
        println "Cloning ${repoUrl} into ${dir.absolutePath}" + (branch ? " and switching to ${branch}" : "")
        exec {
            commandLine 'git', 'clone', repoUrl, dir.absolutePath
        }
        if (branch) {
            exec {
                workingDir dir.absolutePath
                commandLine 'git', 'checkout', branch
            }
        }
    } else {
        if (branch) {
            def currentBranch = ['git', '-C', dir.absolutePath, 'rev-parse', '--abbrev-ref', 'HEAD'].execute().text.trim()
            if (currentBranch == 'HEAD') {
                println "WARNING: ${targetDir} is not on a branch, expected '${branch}'"
            } else if (currentBranch && currentBranch != branch) {
                println "WARNING: ${targetDir} is on branch '${currentBranch}', expected '${branch}' (see samplesBranch in gradle.properties)"
            }
        }
        if (settings.ext.find('pullExamples')) {
            println "Pulling the latest changes in ${dir.absolutePath}"
            exec {
                workingDir dir.absolutePath
                commandLine 'git', 'pull'
            }
        }
    }
}

