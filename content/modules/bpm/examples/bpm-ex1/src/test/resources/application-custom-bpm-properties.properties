# BPM application properties shown on the documentation pages.
# The BpmPropertiesTest checks them in the "custom-bpm-properties" profile,
# so the demo application keeps the default values.

# tag::initiator-variable-name[]
jmix.bpm.process-initiator-variable-name=processInitiator
# end::initiator-variable-name[]

# tag::data-task-spring-bean[]
jmix.bpm.data-task-spring-bean-entity-attribute-enabled=true
# end::data-task-spring-bean[]
